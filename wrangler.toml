# Cloudflare Pages + Functions config for Beauty & Color Tattoo.
# The static site is unchanged; this only wires up the CMS Functions,
# D1 (news data) and R2 (news images). No secrets belong in this file
# (database_id / bucket name / Access AUD are identifiers, not secrets).

name = "beauty-color-tattoo-gelsenkirchen"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# --- D1: structured news data ---
[[d1_databases]]
binding = "DB"
database_name = "bct-news"
database_id = "69945e9b-e38e-4a3c-b3c6-f7a73a4d03d2"

# --- R2: uploaded news images ---
[[r2_buckets]]
binding = "NEWS_BUCKET"
bucket_name = "bct-news-images"

# --- Public (non-secret) variables used for Cloudflare Access verification ---
[vars]
# Your Zero Trust team domain, e.g. "beautyandcolor.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_your-team.cloudflareaccess.com"
# The Access Application "Application Audience (AUD) Tag"
ACCESS_AUD = "REPLACE_WITH_YOUR_ACCESS_APPLICATION_AUD"
# Optional: restrict writes to one or more owner e-mails (comma separated)
# OWNER_EMAIL = "inhaberin@example.com"

# --- Shop / PayPal (non-secret settings) ---
PAYPAL_ENV = "sandbox"                 # "sandbox" zum Testen, "live" für echten Verkauf
# MAIL_FROM = "shop@beautyandcolor-gelsenkirchen.de"   # verifizierter Absender (MailChannels)
#
# GEHEIM — NICHT hier eintragen, sondern als Pages-Secrets setzen
# (npx wrangler pages secret put <NAME>  ODER Dashboard → Settings → Environment variables → Encrypt):
#   PAYPAL_CLIENT_ID   (öffentlich einsehbar, aber zusammen mit Secret verwaltet)
#   PAYPAL_SECRET      (streng geheim)
#   PAYPAL_WEBHOOK_ID  (aus der PayPal-Webhook-Konfiguration)
#
# NOTE: ACCESS_DEV_EMAIL is intentionally NOT set here. It is only used for
# LOCAL development with `wrangler pages dev` (see README-CMS.md) and must
# never exist in production.
