# Cloudflare Pages + Functions config for Beauty & Color Tattoo.
# The static site is unchanged; this only wires up the CMS Functions,
# D1 (news data) and R2 (news images). No secrets belong in this file
# (database_id / bucket name / ADMIN_USER are identifiers, not secrets).

name = "beauty-color-tattoo-gelsenkirchen"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# --- D1: structured news data ---
[[d1_databases]]
binding = "DB"
database_name = "bct-news"
database_id = "69945e9b-e38e-4a3c-b3c6-f7a73a4d03d2"

# --- R2: uploaded news images ---
# DEAKTIVIERT, bis R2 im Cloudflare-Konto freigeschaltet und der Bucket angelegt ist
# (sonst schlaegt jedes Deployment fehl: "R2 bucket 'bct-news-images' not found").
# Danach: npx wrangler r2 bucket create bct-news-images  →  diese drei Zeilen wieder aktivieren.
# Ohne R2: Text-News funktionieren normal, nur der Bild-Upload meldet 503.
# [[r2_buckets]]
# binding = "NEWS_BUCKET"
# bucket_name = "bct-news-images"

# --- Admin-Login (eigener Login — KEIN Cloudflare Access / Zero Trust) ---
[vars]
# Benutzername für /admin (kein Geheimnis).
ADMIN_USER = "nicole"

# GEHEIM — NICHT hier eintragen, sondern als Pages-Secret setzen:
#   ADMIN_PASSWORD   Passwort für /admin (Pflicht; ohne das ist der Login nicht scharf)
#   SESSION_SECRET   optional; wird sonst aus ADMIN_PASSWORD abgeleitet
# Setzen:  npx wrangler pages secret put ADMIN_PASSWORD --project-name beauty-color-tattoo-gelsenkirchen
# oder:    Dashboard -> Pages -> Settings -> Variables and Secrets -> Secret

# --- Shop / PayPal (non-secret settings) ---
PAYPAL_ENV = "sandbox"                 # "sandbox" zum Testen, "live" für echten Verkauf
# MAIL_FROM = "shop@beautyandcolor-gelsenkirchen.de"   # verifizierter Absender (MailChannels)
#
# GEHEIM — NICHT hier eintragen, sondern als Pages-Secrets setzen
# (npx wrangler pages secret put <NAME>  ODER Dashboard → Settings → Environment variables → Encrypt):
#   PAYPAL_CLIENT_ID   (öffentlich einsehbar, aber zusammen mit Secret verwaltet)
#   PAYPAL_SECRET      (streng geheim)
#   PAYPAL_WEBHOOK_ID  (aus der PayPal-Webhook-Konfiguration)
#
# OPTIONAL — automatischer Gutschein-Versand per E-Mail (der Shop laeuft auch ohne):
#   MAIL_FROM          verifizierte Absenderadresse
#   + genau EINER davon: RESEND_API_KEY | BREVO_API_KEY | MAILCHANNELS_API_KEY
#
# Lokal testen: npx wrangler pages dev . --d1 DB --r2 NEWS_BUCKET --binding ADMIN_PASSWORD=<test>
